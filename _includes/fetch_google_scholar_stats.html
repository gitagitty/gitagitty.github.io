<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            if (!data) { return; }

            // Total citation count. getElementById returns null when the page has no
            // #total_cit element, so guard it instead of writing to null.innerHTML.
            var totalCitEl = document.getElementById('total_cit');
            if (totalCitEl !== null && data['citedby'] !== undefined) {
                totalCitEl.innerHTML = data['citedby'];
            }

            // Per-paper citation counts. Each element looks like:
            //   <span class='show_paper_citations' data='AUTHOR_PUB_ID'></span>
            var publications = data['publications'] || {};
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                var paper = publications[paperId];
                // A paper Google Scholar has not indexed yet is skipped silently,
                // rather than throwing on undefined['num_citations'].
                if (!paper || paper['num_citations'] === undefined) { return; }
                element.innerHTML = '| Citations: ' + paper['num_citations'];
            });
        });
    })
</script>
